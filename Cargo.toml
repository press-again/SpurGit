[package]
name = "spurgit"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-kit = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Embeds assets/spur.ico as icon resource 1 of the executable (the icon GPUI's
# Windows platform loads for the window and taskbar).
embed-resource = "3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
