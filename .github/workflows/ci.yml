name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The app compares its Cargo version against the tag to find updates.
      - shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != Cargo.toml $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # The fonts' OFL and the MIT notices must travel with the binary.
      - run: >
          Compress-Archive -DestinationPath spurgit-${{ github.ref_name }}-windows-x64.zip
          -Path target/release/spurgit.exe, LICENSE,
          assets/fonts/THIRD_PARTY_NOTICES.md, assets/fonts/Geist-OFL.txt
      - run: gh release create ${{ github.ref_name }} spurgit-${{ github.ref_name }}-windows-x64.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds, ad-hoc signs and zips Spur.app (the Windows job made the release).
      - run: packaging/macos/bundle.sh spurgit-${{ github.ref_name }}-macos-arm64.zip
      - run: gh release upload ${{ github.ref_name }} spurgit-${{ github.ref_name }}-macos-arm64.zip
        env:
          GH_TOKEN: ${{ github.token }}
